# 30 questions: 24 answerable (q01-q24), 6 unanswerable (q25-q30).
# expected_contains: a SHORT string that appears verbatim in the extracted .txt (pypdf output,
#   not what the PDF looks like: "Q2" is often extracted as "02", numbers get stray spaces).
#   Check with:  grep -o "your string" data/filings/TICKER/QUARTER/result-*.txt
#   It is matched against retrieved chunk text, so it survives re-chunking (chunk_ids don't).
# answerable: false  ->  leave expected_* empty; the correct behaviour is to refuse.
# structure: table | note | prose | none
#   table = figure in a financial-results table, note = a stated figure/ratio/notice in a
#   results filing, prose = something management said on an earnings call.

# ============ TABLE (8) ============
